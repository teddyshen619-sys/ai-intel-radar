    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ai-intel-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (err) {
          var fallbackRoot = document.documentElement;
          fallbackRoot.classList.remove('dark');
          fallbackRoot.dataset.theme = 'light';
          fallbackRoot.style.colorScheme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./css/preflight.css" />
    <link rel="stylesheet" href="./css/terminal.css" />
    <link rel="stylesheet" href="./css/utilities.css" />

            <circle cx="18.51" cy="5.49" r="2.05" fill="#0066CC" class="dark:fill-[#2997FF]"></circle>
          </svg>

              <line x1="12" y1="2" x2="12" y2="4.5"></line>

    <!-- Main Editorial Shell -->
    <div
      id="top"
      class="mx-auto flex min-h-[calc(100vh-3.75rem)] w-full max-w-[1120px] flex-col px-6 sm:px-10"
    >
      <nav id="subdirectory" class="subdirectory" aria-label="子目录">
        <div id="channel-tabs" class="subdirectory-tabs no-scrollbar" role="group" aria-label="情报频道">
          <button type="button" data-channel="ALL" data-active="true" aria-pressed="true" class="nav-channel-btn">全部</button>
          <button type="button" data-channel="RADAR" data-active="false" aria-pressed="false" class="nav-channel-btn">算力避坑</button>
          <button type="button" data-channel="INTEL" data-active="false" aria-pressed="false" class="nav-channel-btn">厂商情报</button>
          <button type="button" data-channel="REVIEW" data-active="false" aria-pressed="false" class="nav-channel-btn">测评视频</button>
          <button type="button" data-channel="MODELS" data-active="false" aria-pressed="false" class="nav-channel-btn">模型比价</button>
        </div>
        <div id="guide-directory" class="guide-directory" hidden>

        </div>

      <header class="editorial-masthead">
        <h1
          id="masthead-title"
          class="font-editorial-display max-w-[18ch] text-[38px] sm:text-[48px] lg:text-[56px] tracking-[-0.03em] leading-[1.1] text-[#1D1D1F] dark:text-[#F5F5F7]"
        >
          前沿 AI 情报与算力简报
        </h1>
        <div id="visit-increment" class="visit-increment" hidden>
          <span id="visit-increment-text" aria-live="polite"></span>
          <button id="visit-mark-read" class="visit-mark-read" type="button">标为已读</button>
        </div>
      </header>

      <!-- Friendly file:// fallback notice -->
      <div
        id="file-protocol-banner"
        role="alert"
        class="hidden mb-8 border-l-2 border-[#D93025] bg-[#F5F5F7] px-5 py-4 text-[13.5px] text-[#1D1D1F] dark:bg-[#111111] dark:text-[#F5F5F7]"
      >
        <p class="font-medium">检测到通过本地文件直接打开，浏览器可能拦截原生模块脚本。</p>
        <p class="mt-1 text-[#6E6E73] dark:text-[#A1A1A6]">
          请在项目根目录启动静态服务访问：<code class="font-mono text-[#1D1D1F] dark:text-[#F5F5F7]">python -m http.server 8766 --directory web</code>
        </p>

          请启用浏览器 JavaScript 以阅读完整情报简报与搜索功能。
        </div>
      </noscript>

      <!-- Quiet Editorial Controls & Contextual Filters -->
      <section id="intel-controls" aria-label="频道细分与检索" class="border-t border-b border-black/[0.08] dark:border-white/[0.10]">

            id="sub-type-tabs"
            role="group"
            aria-label="情报子分类筛选"
            class="flex flex-wrap items-center gap-x-7 gap-y-2 min-w-0"
          ></div>
          <a id="review-video-search" class="story-link" hidden target="_blank" rel="noopener noreferrer">在 B 站搜相关视频 ↗</a>
        </div>

        <!-- Contextual Vendor Strip (Only in INTEL) -->
        <div
          id="vendor-filter-bar"
          class="hidden flex-wrap items-center gap-x-7 gap-y-2 border-b border-black/[0.06] py-3.5 dark:border-white/[0.08]"
        >
          <div
            id="vendor-chips"
            role="group"
            aria-label="AI 厂商筛选"
            class="flex flex-wrap items-center gap-x-6 gap-y-2 min-w-0"
          ></div>
        </div>

        <!-- Quiet Search & Archive Toggle -->
        <div class="flex flex-col gap-3 py-3.5 sm:flex-row sm:items-center sm:justify-between">
          <div class="relative flex-1 max-w-md min-w-0">
            <span
              class="pointer-events-none absolute inset-y-0 left-0 flex items-center text-[#86868B] dark:text-[#8E8E93]"
              aria-hidden="true"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>

            <input
              type="search"
              id="search-input"
              placeholder="检索模型、厂商或关键词..."
              autocomplete="off"
              spellcheck="false"
              aria-label="关键词实时检索"
              class="w-full min-w-0 bg-transparent py-1.5 pl-6 pr-7 text-[14px] text-[#1D1D1F] placeholder-[#86868B] focus:outline-none dark:text-[#F5F5F7] dark:placeholder-[#8E8E93]"
            />

            <button
              type="button"
              id="search-clear-btn"
              aria-label="清空检索词"
              class="hidden absolute inset-y-0 right-0 my-auto inline-flex h-6 w-6 items-center justify-center text-[#86868B] hover:text-[#1D1D1F] dark:text-[#8E8E93] dark:hover:text-[#F5F5F7] cursor-pointer"
            >
              <svg
                class="h-3.5 w-3.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="feed-toolbar-actions" role="group" aria-label="视图与筛选">
            <div class="density-segmented" role="group" aria-label="列表视图切换">
              <button
                type="button"
                class="density-segment-btn"
                data-density="magazine"
                aria-pressed="true"
              >
                <svg
                  class="toolbar-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.85"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="7.5" height="16" rx="1"></rect>
                  <rect x="13.5" y="4" width="7.5" height="16" rx="1"></rect>
                </svg>
                <span>杂志</span>
              </button>
              <button
                type="button"
                class="density-segment-btn"
                data-density="brief"
                aria-pressed="false"
              >
                <svg
                  class="toolbar-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.85"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <line x1="3.5" y1="6" x2="20.5" y2="6"></line>
                  <line x1="3.5" y1="12" x2="20.5" y2="12"></line>
                  <line x1="3.5" y1="18" x2="20.5" y2="18"></line>
                </svg>
                <span>快讯</span>
              </button>
            </div>

            <button
              type="button"
              id="saved-filter"
              class="toolbar-bookmark-btn"
              aria-pressed="false"
              aria-label="仅看收藏（当前 0 条）"
            >
              <svg
                class="toolbar-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 3h12v18l-6-4-6 4z"></path>
              </svg>
              <span>收藏</span>
              <span id="saved-filter-count" class="saved-filter-count" hidden></span>
            </button>

            <label
              for="toggle-hide-fixed"
              class="toolbar-active-toggle"
            >
              <input
                type="checkbox"
                id="toggle-hide-fixed"
                checked
                aria-label="仅看当前有效情报"
                class="sr-only"
              />
              <span class="toolbar-active-dot" aria-hidden="true"></span>
              <span>仅看有效</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Main Editorial Content (Pure Story Rhythm — Zero Noisy Sub-headers) -->
      <main id="intel-main" class="flex-1 min-w-0 max-w-full pt-10 sm:pt-12 pb-24 space-y-6 sm:space-y-8">
        <!-- Flagship Editorial Spotlight -->
        <section
          id="headline-section"
          aria-label="今日焦点"
          class="hidden min-w-0 max-w-full"
        >
          <div
            id="headline-grid"
            class="flex flex-col gap-5 sm:gap-6 min-w-0 max-w-full"
          ></div>
        </section>

        <!-- Architectural Editorial Feed Grid -->
        <section
          id="feed-section"
          aria-label="最新简报列表"
          class="min-w-0 max-w-full"
        >
          <div
            id="intel-feed"
            aria-label="情报列表"
            class="grid grid-cols-1 gap-5 sm:gap-6 md:grid-cols-2 min-w-0 max-w-full"
          ></div>
        </section>

        <!-- Minimal Empty State -->
        <section
          id="empty-state"
          aria-live="polite"
          class="hidden bg-[#F5F5F7] dark:bg-[#111111] px-8 py-20 text-center"
        >
          <h2 class="font-editorial-display text-[24px] tracking-[-0.02em] text-[#1D1D1F] dark:text-[#F5F5F7]">
            暂未检索到相关简报
          </h2>
          <p class="mx-auto mt-3 max-w-[44ch] text-[14.5px] leading-[1.65] text-[#6E6E73] dark:text-[#A1A1A6]">
            可以尝试更换关键词、切换频道，或取消勾选「仅看当前有效」浏览已归档内容。
          </p>
          <button
            type="button"
            id="reset-filters-btn"
            class="mt-6 inline-flex items-center border-b border-[#0066CC] pb-0.5 text-[14px] text-[#0066CC] hover:opacity-70 dark:border-[#2997FF] dark:text-[#2997FF] cursor-pointer"
          >
            恢复默认浏览
          </button>
        </section>
      </main>

      <main id="model-panel" hidden aria-labelledby="masthead-title">
        <p id="model-changes" class="catalog-changes" aria-live="polite" hidden></p>
        <div class="catalog-controls">
          <label>搜索模型<input type="search" id="model-search" placeholder="模型、厂商或关键词"></label>
          <label>费用<select id="model-free"><option value="all">全部模型</option><option value="free">仅看免费模型</option></select></label>
          <label>厂商<select id="model-vendor"><option value="">全部厂商</option></select></label>
          <label>排序<select id="model-sort">
            <option value="input_per_m">输入单价从低到高</option>
            <option value="output_per_m">输出单价从低到高</option>
            <option value="context_length">上下文从长到短</option>
            <option value="created_at">最近上线优先</option>
          </select></label>
        </div>
        <fieldset class="budget">
          <legend>月度预算估算器</legend>
          <label>输入百万 Token 数<input id="budget-input" type="number" min="0" step="any" value="1"></label>
          <label>输出百万 Token 数<input id="budget-output" type="number" min="0" step="any" value="1"></label>
        </fieldset>
        <p class="catalog-caption" id="model-summary" aria-live="polite"></p>
        <p class="catalog-guide"><a id="model-guides-link" href="?channel=GUIDES">开通或接入有疑问？前往实战教程 →</a></p>
        <div class="spec-scroll" tabindex="0" role="region" aria-label="模型价格对比表">

            <thead><tr><th scope="col">模型</th><th scope="col">输入单价</th><th scope="col">输出单价</th><th scope="col">上下文长度</th><th scope="col">上线日期</th><th scope="col">预估月费</th></tr></thead>
            <tbody id="model-rows"></tbody>
          </table>
        </div>

      <main id="guides-panel" hidden aria-labelledby="masthead-title" class="guides-panel flex-1 min-w-0 max-w-full"></main>

      <main id="intel-detail-panel" hidden class="flex-1 min-w-0 max-w-full" aria-labelledby="intel-detail-title"></main>

        class="border-t border-black/[0.08] py-10 text-[12.5px] text-[#86868B] dark:border-white/[0.10] dark:text-[#8E8E93]"
